name: Monthly Dialysis Data Ingestion

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month to capture the full prior month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual triggers from GitHub UI for testing
  
jobs:
  run-ingestion:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas sqlalchemy psycopg2-binary python-dotenv

      - name: Run Incremental Monthly Ingestion
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python append_monthly_data.py
